name: mongo-express

services:
  mongodb:
    # Official image already ships `mongosh` — no custom build needed.
    # Pinned to 7.x: MongoDB 8.x refuses to start on Linux kernels 6.19–7.0.13
    # (Docker Desktop's VM runs 7.0.x-linuxkit) — see SERVER-121912.
    image: mongo:7
    container_name: mern-blog-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: user
